# Merge this under the existing `- id: llm-pi-ai` → `config.providers` of
# your profile patch (C:\Users\<you>\.dsh\profiles\<profile>\cordis.patch.yml,
# or ~/.dsh/profiles/<profile>/cordis.patch.yml). Keep your other providers.
#
# `apiKeyEnv` is a credential reference, never the key itself: store the key in
# DSH's credentials store (Models page) under the same name, or export it in the
# environment that launches DSH.
#
# The `compat` block is what makes a DeepSeek reasoning model usable through an
# OpenAI-compatible gateway: `max_tokens` instead of `max_completion_tokens`,
# no `store`, no `developer` role, and replayed assistant messages keep their
# `reasoning_content`.
cpa-go:
  displayName: CPA OpenCode Go
  apiKeyEnv: CPA_API_KEY
  api: openai-completions
  baseURL: https://api-dir.az1n.com/v1
  models:
    - id: go/deepseek-v4.1-flash
      name: DeepSeek V4.1 Flash [CPA / OpenCode Go]
      contextWindow: 1000000
      maxTokens: 384000
      input: [text, image]
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek
      reasoningEfforts:
        off: null
        low: low
        medium: medium
        high: high
